// General
fps_max "0"											//Frame rate limiter. 0=no limit. Does not apply to dedicated server.

// Gameplay
//bind z "slot10"
//bind x "slot8"
//bind c "slot7"
//bind "mwheelup" +jump
sensitivity "0.8"

// Viewmodel
viewmodel_offset_x "2.5"								//Changes viewmodel view in X scale (-2 to 2.5)
viewmodel_offset_y "-2"									//Changes viewmodel view in Y scale (-2 to 2)
viewmodel_offset_z "-2"									//Changes viewmodel view in Z scale (-2 to 2)
viewmodel_fov "68"										//Highest viewmodel FOV (54 to 68)

// Custom Binds
bind ' "noclip"
bind / sv_rethrow_last_grenade
bind ] "ent_fire smokegrenade_projectile kill; stopsound"
bind - "say Get Leetify"
bind mouse5 "incrementvar cl_radar_scale 0 1 0.25"

// nade bug
alias "+hepull" "slot6"
alias "+flashpull" "slot7"
alias "+smokepull" "slot8"
alias "+molopull" "slot10"
alias "+knifepull" "slot3"

alias "+smokepick" "pickup_groundweapon 45"
alias "+molopick" "pickup_groundweapon 46"
alias "+flashpick" "pickup_groundweapon 43"
alias "+hepick" "pickup_groundweapon 44"
alias "+incpick" "pickup_groundweapon 48"

bind "c" "+flashpick;+knifepull;+flashpull"          // flash
bind "x" "+smokepick;+knifepull;+smokepull"          // smoke
bind "z" "+molopick;+incpick;+knifepull;+molopull"   // molotov/incendiary

// Shortcuts for console commands
alias "dc" "disconnect"
alias "prac"	"sv_grenade_trajectory_prac_pipreview 1; sv_grenade_trajectory_prac_trailtime 4; mp_buy_anywhere 1; mp_freezetime 0; mp_ignore_round_win_conditions 1; mp_buytime 99999; mp_startmoney 60000; mp_maxmoney 60000; ; ammo_grenade_limit_total 6; mp_autoteambalance 0; mp_limitteams 0; mp_warmup_pausetimer 1; mp_warmup_start; sv_cheats 1; sv_infinite_ammo 2; bot_kick"
alias "placebot" "bot_add ct easy; bot_stop 1; bot_place"


bind "[" "placebot"

